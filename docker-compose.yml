services:
  postgres:
    image: postgres:16-alpine
    container_name: sturnus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sturnus
      POSTGRES_PASSWORD: sturnus
      POSTGRES_DB: sturnus_flows
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sturnus -d sturnus_flows"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sturnus-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://sturnus:sturnus@postgres:5432/sturnus_flows
      FRONTEND_URL: http://localhost:5173
      PORT: 3333
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - whatsapp_tokens:/app/tokens
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run dev"

  frontend:
    build:
      context: ./frontend
    container_name: sturnus-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: http://localhost:3333
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  whatsapp_tokens:
  backend_node_modules:
  frontend_node_modules:
