services:
  postgres:
    image: postgres:16-alpine
    container_name: sturnus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sturnus
      POSTGRES_PASSWORD: sturnus
      POSTGRES_DB: sturnus_flows
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sturnus -d sturnus_flows"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sturnus-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://sturnus:sturnus@postgres:5432/sturnus_flows
      FRONTEND_URL: http://localhost:6803
      BETTER_AUTH_URL: http://localhost:6802
      PORT: 6802
      WORKER_URL: http://worker-whatsapp:6801
    ports:
      - "6802:6802"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run dev"

  worker-whatsapp:
    build:
      context: ./worker-whatsapp
    container_name: sturnus-worker-whatsapp
    restart: unless-stopped
    env_file:
      - ./worker-whatsapp/.env
    environment:
      PORT: 6801
      BACKEND_WEBHOOK_URL: http://backend:6802/api/webhooks/whatsapp
    ports:
      - "6801:6801"
    volumes:
      - ./worker-whatsapp:/app
      - worker_whatsapp_node_modules:/app/node_modules
      - worker_whatsapp_tokens:/app/tokens
    # O Chromium do wppconnect precisa de mais /dev/shm que o padrão (64MB).
    shm_size: "1gb"
    command: sh -c "npm run dev"

  ai-worker:
    build:
      context: ./AI-Worker/piloto
    container_name: sturnus-ai-worker
    restart: unless-stopped
    env_file:
      - ./AI-Worker/piloto/.env
    environment:
      PORT: 6804
      BACKEND_URL: http://backend:6802
    ports:
      - "6804:6804"

  frontend:
    build:
      context: ./frontend
      # Desenvolvimento com hot reload; em produção o Dockerfile termina no nginx.
      target: dev
    container_name: sturnus-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      PORT: 6803
      VITE_API_URL: http://localhost:6802
    ports:
      - "6803:6803"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  worker_whatsapp_node_modules:
  worker_whatsapp_tokens:
