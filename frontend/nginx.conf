server {
    listen 6803;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Arquivos com hash no nome (gerados pelo Vite): cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache, para um deploy novo aparecer na hora.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: rotas do React Router (/login, /organizacoes, ...) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
